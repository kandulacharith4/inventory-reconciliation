[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inventory-reconciliation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reconcile = "reconcile:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
